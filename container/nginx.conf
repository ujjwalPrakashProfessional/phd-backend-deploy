server{
    listen 80 default_server;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location / {
        proxy_pass http://127.0.0.1:3470;
    }
    location /api/ras {
        proxy_pass http://127.0.0.1:3470;
    }
    location /api/auth {
        proxy_pass http://127.0.0.1:3475;
    }
    location /api/student {
        proxy_pass http://127.0.0.1:3480;
    }
    location /api/company {
        proxy_pass http://127.0.0.1:3485;
    }
    location /api/admin/rc {
        proxy_pass http://127.0.0.1:3490;
    }
    location /api/admin/application/rc {
        proxy_pass http://127.0.0.1:3492;
    }
    location /api/admin/company {
        proxy_pass http://127.0.0.1:3495;
    }
    location /api/admin/student {
        proxy_pass http://127.0.0.1:3500;
    }
}